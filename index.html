<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トラに話す">
<meta name="theme-color" content="#e8732a">
<meta name="robots" content="noindex, nofollow">
<title>トラに話す</title>
<script>
  // 何かが起きたら画面に出す（スマホではコンソールが見られないため）。本体のスクリプトより前に登録する
  window.addEventListener('error', function (ev) {
    try {
      var box = document.getElementById('fatal');
      if (!box) { box = document.createElement('pre'); box.id = 'fatal'; box.style.cssText = 'white-space:pre-wrap;color:#b00020;background:#fff3f3;padding:12px;margin:12px;border-radius:12px;font-size:12px;'; (document.body || document.documentElement).appendChild(box); }
      box.textContent += 'エラー: ' + (ev.message || ev) + (ev.lineno ? ' (行 ' + ev.lineno + ')' : '') + '\n';
    } catch (e) {}
  });
  window.addEventListener('DOMContentLoaded', function () {
    // 本体が何らかの理由で画面を出せなかったときの保険：1 秒後にどの画面も出ていなければ設定画面を出す
    setTimeout(function () {
      var ids = ['secSettings', 'secChat'], shown = false;
      ids.forEach(function (id) { var el = document.getElementById(id); if (el && !el.classList.contains('hidden')) shown = true; });
      if (!shown) {
        var st = document.getElementById('secSettings'); if (st) st.classList.remove('hidden');
        var box = document.getElementById('fatal');
        if (!box) { box = document.createElement('pre'); box.id = 'fatal'; box.style.cssText = 'white-space:pre-wrap;color:#b00020;background:#fff3f3;padding:12px;margin:12px;border-radius:12px;font-size:12px;'; document.body.appendChild(box); }
        box.textContent += '画面が出なかったので設定画面を出しました（本体のスクリプトが途中で止まっています）\n';
      }
    }, 1000);
  });
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  :root { --bg:#eef0f3; --ink:#1b1f24; --sub:#6b7280; --line:#e5e7eb; --accent:#e8732a; --rec:#d93025; --ok:#1a7f37; --me:#d9f3c8; --tora:#fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:16px; -webkit-text-size-adjust:100%; }
  .wrap { display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; padding-top:env(safe-area-inset-top); }
  header { padding:12px 14px 8px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:8px; flex:none; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header p { margin:3px 0 0; font-size:12px; color:var(--sub); min-height:16px; }
  header p.live { color:var(--ok); font-weight:600; }
  header button { border:0; background:transparent; color:var(--sub); font-size:12px; padding:6px; cursor:pointer; }
  /* ---- LINE 風の流れ ---- */
  #chat { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 12px 8px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:84%; padding:10px 13px; border-radius:16px; line-height:1.65; font-size:15px; word-break:break-word; white-space:pre-wrap; position:relative; }
  .msg.me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .msg.tora { align-self:flex-start; background:var(--tora); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.sys { align-self:center; background:transparent; color:var(--sub); font-size:12px; padding:2px 8px; text-align:center; max-width:95%; }
  .msg .who { display:block; font-size:11px; color:var(--sub); margin:0 0 2px; }
  .msg.tora .who { color:var(--accent); font-weight:600; }
  .msg .at { font-weight:400; margin-left:6px; }
  .msg .interim { color:var(--sub); }
  .msg .row { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .msg .mini { border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .msg .mini[disabled] { opacity:.5; }
  .msg .note { font-size:12px; color:var(--sub); }
  .msg a { color:#1a56db; word-break:break-all; }
  .msg.card { background:#fff8f2; border:1px solid #f3c9ad; }
  .msg.typing .dots::after { content:"…"; animation:blink 1.2s infinite; }
  /* ---- 朝ブリーフのカード（画面の一番上。今日の分があるときだけ出る。2026-10-23）---- */
  #briefBox { flex:none; padding:10px 12px 0; }
  #briefBox .brief { background:#fff8f2; border:1px solid #f3c9ad; border-radius:14px; padding:10px 12px; }
  #briefBox .title { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px; font-weight:600; }
  #briefBox .title .len { font-weight:400; color:var(--sub); font-size:12px; }
  #briefBox audio { width:100%; margin-top:8px; height:40px; }
  #briefBox .row { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  #briefBox .mini { border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  #briefBox .mini[disabled] { opacity:.5; }
  #briefBox .mini.ghost { border-color:var(--line); color:var(--sub); font-weight:500; }
  #briefBox .note { font-size:12px; color:var(--sub); }
  @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
  /* ---- 下のバー ---- */
  footer { flex:none; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .bar { display:flex; gap:10px; align-items:center; }
  #btnCall { flex:1; border:0; border-radius:999px; padding:16px; font-size:18px; font-weight:700; color:#fff; background:var(--accent); box-shadow:0 4px 14px rgba(232,115,42,.35); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #btnCall.live { background:var(--rec); box-shadow:0 0 0 6px rgba(217,48,37,.12); animation:pulse 1.4s infinite; }
  #btnCall.busy { background:#9ca3af; box-shadow:none; animation:none; }
  #btnCall[disabled] { opacity:.6; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(217,48,37,.3)} 70%{box-shadow:0 0 0 14px rgba(217,48,37,0)} 100%{box-shadow:0 0 0 0 rgba(217,48,37,0)} }
  #btnType { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:12px 14px; font-size:14px; cursor:pointer; white-space:nowrap; }
  .composer { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  textarea, input[type=text] { width:100%; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:16px; line-height:1.6; font-family:inherit; background:#fff; }
  textarea { min-height:96px; resize:vertical; }
  .composer .row { display:flex; gap:8px; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:13px 14px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.ghost { background:transparent; color:var(--sub); font-weight:500; border:1px solid var(--line); }
  .btn.mic { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .btn.mic.rec { background:var(--rec); color:#fff; border-color:var(--rec); }
  .btn[disabled] { opacity:.5; }
  .hint { font-size:12px; color:var(--sub); margin:0; line-height:1.6; }
  .err { color:var(--rec); font-size:13px; line-height:1.6; margin:0; }
  .hidden { display:none !important; }
  /* ---- 設定 ---- */
  #secSettings { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  label { font-size:13px; color:var(--sub); display:block; margin:0 0 4px; }
  .field { display:flex; flex-direction:column; gap:2px; }
  .toggle { display:flex; align-items:center; gap:10px; font-size:15px; color:var(--ink); padding:8px 0; }
  .toggle input { width:22px; height:22px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>トラに話す</h1>
      <p id="status">「話す」を押すとトラと通話になります</p>
    </div>
    <button id="btnSettings" type="button" title="設定">設定</button>
  </header>

  <!-- 0. 設定（送信先 URL と鍵。1 回入れれば localStorage に残る） -->
  <section id="secSettings" class="hidden">
    <div class="hint">送信先を 1 回だけ設定します</div>
    <div class="field">
      <label for="inGas">GAS のウェブアプリ URL（…/exec）</label>
      <input id="inGas" type="text" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="field">
      <label for="inKey">鍵（VOICE_KEY）</label>
      <input id="inKey" type="text" autocomplete="off" placeholder="24 文字の英数字">
    </div>
    <p class="hint">GAS 側の「トラに話す」画面の上にある「マイク対応の画面へ」から開くと、この 2 つは自動で入ります。</p>
    <label class="toggle"><input type="checkbox" id="inLiveVoice" checked> 通話中、トラの声を出す（切ると文字だけ）</label>
    <label class="toggle"><input type="checkbox" id="inAutoplay" checked> 実行役のトラからの返事を自動で読み上げる</label>
    <p class="hint">スマホが自動再生を止めたときは、吹き出しの「聞く」で。</p>
    <button class="btn primary" id="btnSaveSettings" type="button">保存して始める</button>
    <button class="btn ghost" id="btnClearChat" type="button">この画面の履歴を消す</button>
    <p class="err hidden" id="errSettings"></p>
  </section>

  <!-- 1. 会話（LINE 風）。右＝春木さん、左＝トラ -->
  <section id="secChat" class="hidden" style="display:contents">
    <!-- 朝ブリーフ（Drive work-brief の mp3 を GAS 経由で。今日の分が無ければ出ない。2026-10-23） -->
    <div id="briefBox" class="hidden">
      <div class="brief">
        <div class="title"><span id="briefTitle">今日の朝ブリーフ</span><span class="len" id="briefLen"></span></div>
        <audio id="briefAudio" controls preload="metadata"></audio>
        <div class="row">
          <button class="mini" id="btnBriefPlay" type="button">▶ 聞く</button>
          <button class="mini ghost" id="btnBriefPrev" type="button">前の日の分を聞く</button>
          <span class="note" id="briefNote"></span>
        </div>
        <div class="row hidden" id="briefPrevList"></div>
      </div>
    </div>
    <main id="chat"></main>
    <footer>
      <div class="bar">
        <button id="btnCall" type="button">話す</button>
        <button id="btnType" type="button">文字で打つ</button>
      </div>
      <!-- 文字で打つ（v1 の「話す→文字→送る」はここに残す。Live が使えない端末はこれが主） -->
      <div class="composer hidden" id="composer">
        <textarea id="text" placeholder="例：カラコンの什器デザイン、増田くんに今週中の確認をお願いしたい。あと来週の火曜は夕方まで予定を入れないで"></textarea>
        <div class="row">
          <button class="btn mic" id="btnMic" type="button">マイクで入れる</button>
          <button class="btn primary" id="btnSend" type="button">トラに送る</button>
        </div>
        <div class="row">
          <button class="btn ghost" id="btnClear" type="button">消す</button>
          <button class="btn ghost" id="btnCloseComposer" type="button">閉じる</button>
        </div>
        <p class="hint" id="composerHint">送信・支払い・削除など、春木さんの判断が要るものはトラが止めて「判断待ち」にします。</p>
        <p class="err hidden" id="err"></p>
      </div>
      <!-- 通話をまとめずに切ったとき -->
      <div class="composer hidden" id="endPrompt">
        <p class="hint">依頼をまとめる前に終わりました。会話の文字起こしをそのまま実行役のトラに送りますか？</p>
        <div class="row">
          <button class="btn primary" id="btnSendTranscript" type="button">文字起こしを送る</button>
          <button class="btn ghost" id="btnDiscard" type="button">送らない</button>
        </div>
      </div>
    </footer>
  </section>
</div>

<script>
  // ===== 設定（送信先と鍵）=====
  // 優先順位：URL の ?gas=…&k=… → localStorage。URL は消さない（ホーム画面に追加したアイコンに設定が含まれるように。
  // ホーム画面から開く Chrome は保存領域が別のことがあるので、URL に残すのがいちばん確実）
  var LS_GAS = 'tora_gas', LS_KEY = 'tora_key', LS_AUTOPLAY = 'tora_autoplay', LS_SINCE = 'tora_replies_since', LS_LIVE_VOICE = 'tora_live_voice', LS_CHAT = 'tora_chat';
  var $ = function (id) { return document.getElementById(id); };
  var GAS = '', KEY = '', urlGas = '', urlKey = '';
  var AUTOPLAY = true, LIVE_VOICE = true;
  try { AUTOPLAY = localStorage.getItem(LS_AUTOPLAY) !== '0'; LIVE_VOICE = localStorage.getItem(LS_LIVE_VOICE) !== '0'; } catch (e) {}
  (function loadSettings() {
    var q = new URLSearchParams(location.search);
    urlGas = normalizeGas(q.get('gas') || ''); urlKey = (q.get('k') || '').trim();
    var saved = { gas: '', key: '' };
    try { saved.gas = localStorage.getItem(LS_GAS) || ''; saved.key = localStorage.getItem(LS_KEY) || ''; } catch (e) {}
    GAS = validGas(urlGas) ? urlGas : saved.gas;
    KEY = urlKey || saved.key;
    if (validGas(GAS) && KEY) { try { localStorage.setItem(LS_GAS, GAS); localStorage.setItem(LS_KEY, KEY); } catch (e) {} }
  })();
  function putSettingsInUrl(g, k) {
    try { history.replaceState(null, '', location.pathname + '?gas=' + encodeURIComponent(g) + '&k=' + encodeURIComponent(k)); } catch (e) {}
  }
  function normalizeGas(u) { return (u || '').trim().replace(/^https:\/\/script\.google\.com\/a\/(macros\/)?[^/]+\/(macros\/)?s\//, 'https://script.google.com/macros/s/').replace(/\?.*$/, ''); }
  function validGas(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u); }

  // ===== 画面 =====
  function show(sec) {
    $('secSettings').classList.toggle('hidden', sec !== 'secSettings');
    $('secChat').classList.toggle('hidden', sec !== 'secChat');
  }
  function setStatus(msg, live) { $('status').textContent = msg; $('status').classList.toggle('live', !!live); }
  function showErr(id, msg) { $(id).textContent = msg; $(id).classList.remove('hidden'); }
  function nowHM() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  // ===== 送信（GAS の doPost へ）=====
  // GAS はプリフライト（OPTIONS）に応えられないので Content-Type を付けず「単純リクエスト」で送る（文字列 body → text/plain）。
  // GAS の返事には Access-Control-Allow-Origin:* が付くので JSON を読める（2026-10-22 node で確認）。
  // strict=false（submit）：読めなかったときは「届いた見込み」として成功扱い（自動では送り直さない）。strict=true：reject
  function postToGas(payload, strict) {
    payload.k = KEY;
    var body = JSON.stringify(payload);
    return fetch(GAS, { method: 'POST', mode: 'cors', body: body, redirect: 'follow' })
      .then(function (res) {
        return res.text().then(function (t) {
          var r = null;
          try { r = JSON.parse(t); } catch (e) {}
          if (!res.ok) throw new Error('HTTP ' + res.status);
          if (!r) throw new Error('返事が JSON ではありません（デプロイの「アクセスできるユーザー」が「全員」か確認）');
          if (r.ok === false) throw new Error(r.error || 'GAS 側でエラー');
          return r;
        }, function () { if (strict) throw new Error('opaque'); return { ok: true, unconfirmed: true }; });
      }, function (err) {
        if (navigator.onLine === false) throw new Error('オフラインです。電波のあるところでもう一度');
        if (strict) throw new Error('unreadable');
        return { ok: true, unconfirmed: true };
      });
  }
  // JSONP（fetch の返事が読めない端末の予備。replies／tts だけ）
  var jsonpSeq = 0, useJsonp = false;
  function jsonpToGas(payload) {
    return new Promise(function (resolve, reject) {
      var cb = 'toraCb' + (++jsonpSeq) + '_' + Date.now();
      var qs = 'action=' + encodeURIComponent(payload.action) + '&k=' + encodeURIComponent(KEY) + '&callback=' + cb;
      Object.keys(payload).forEach(function (key) { if (key !== 'action' && key !== 'k') qs += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(String(payload[key])); });
      var s = document.createElement('script');
      var timer = setTimeout(function () { done(); reject(new Error('JSONP timeout')); }, 25000);
      function done() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function (r) { done(); if (!r || r.ok === false) reject(new Error((r && r.error) || 'GAS 側でエラー')); else resolve(r); };
      s.onerror = function () { done(); reject(new Error('JSONP error')); };
      s.src = GAS + '?' + qs;
      document.head.appendChild(s);
    });
  }
  function callGas(payload) {
    if (useJsonp) return jsonpToGas(payload);
    return postToGas(payload, true).catch(function (e) {
      if (e && (e.message === 'opaque' || e.message === 'unreadable')) { useJsonp = true; return jsonpToGas(payload); }
      throw e;
    });
  }
  // live_token／tool は POST のみ（JSONP に落とせない）。読めない端末では会話モードは使えない旨を出す
  function postStrict(payload) {
    return postToGas(payload, true).catch(function (e) {
      if (e && (e.message === 'opaque' || e.message === 'unreadable')) throw new Error('この端末では GAS の返事が読めないため、通話モードは使えません（「文字で打つ」は使えます）');
      throw e;
    });
  }

  // ===== 吹き出し（LINE 風）。履歴は localStorage に直近 50 件 =====
  // 変数名は history にしない（window.history と衝突して jsdom／ブラウザで止まる。2026-10-22 check_dom.js で検出）
  var chatLog = [];
  try { chatLog = JSON.parse(localStorage.getItem(LS_CHAT) || '[]'); if (!Array.isArray(chatLog)) chatLog = []; } catch (e) { chatLog = []; }
  function saveHistory() { try { localStorage.setItem(LS_CHAT, JSON.stringify(chatLog.slice(-50))); } catch (e) {} }
  function scrollChat() { var c = $('chat'); c.scrollTop = c.scrollHeight + 1000; }
  // side: 'me' | 'tora' | 'sys'。opts: {who, at, tts(聞くボタン), audio(base64 wav), html(リンク等), persist(既定 true), typing}
  function addMsg(side, text, opts) {
    opts = opts || {};
    var b = document.createElement('div'); b.className = 'msg ' + side + (opts.card ? ' card' : '') + (opts.typing ? ' typing' : '');
    if (side !== 'sys') {
      var who = document.createElement('span'); who.className = 'who'; who.textContent = opts.who || (side === 'me' ? '春木さん' : 'トラ');
      var at = document.createElement('span'); at.className = 'at'; at.textContent = opts.at || nowHM(); who.appendChild(at);
      b.appendChild(who);
    }
    var txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = text || '';
    if (opts.typing) { txt.className += ' dots'; }
    b.appendChild(txt);
    if (opts.url) {
      var row = document.createElement('div'); row.className = 'row';
      var a = document.createElement('a'); a.href = opts.url; a.textContent = opts.url; a.target = '_blank'; a.rel = 'noopener';
      var copy = document.createElement('button'); copy.type = 'button'; copy.className = 'mini'; copy.textContent = 'コピー';
      copy.addEventListener('click', function () { try { navigator.clipboard.writeText(opts.url).then(function () { copy.textContent = 'コピーした'; }); } catch (e) { copy.textContent = '長押しでコピー'; } });
      row.appendChild(copy);
      if (navigator.share) {
        var sh = document.createElement('button'); sh.type = 'button'; sh.className = 'mini'; sh.textContent = 'LINE などで送る';
        sh.addEventListener('click', function () { navigator.share({ text: (opts.shareText || '') + opts.url }).catch(function () {}); });
        row.appendChild(sh);
      }
      b.appendChild(document.createElement('br')); b.appendChild(a); b.appendChild(row);
    }
    if (side === 'tora' && (opts.tts || opts.audio)) attachPlay(b, text, opts.audio || '');
    $('chat').appendChild(b);
    scrollChat();
    b.setText = function (t) { txt.textContent = t; b._text = t; scrollChat(); };
    b.addText = function (t) { txt.textContent += t; b._text = txt.textContent; scrollChat(); };   // DOM の append と被らない名前に
    b._text = text || '';
    if (opts.persist !== false && !opts.typing) {
      chatLog.push({ side: side, text: text || '', who: opts.who || '', at: opts.at || nowHM(), url: opts.url || '', tts: !!(opts.tts || opts.audio), card: !!opts.card });
      saveHistory();
    }
    return b;
  }
  // 「聞く」：audio があればそのまま、無ければ GAS の tts で声にする
  var currentAudio = null;
  function playWavBase64(b64) {
    return new Promise(function (resolve, reject) {
      try {
        if (currentAudio) { try { currentAudio.pause(); } catch (e) {} }
        var a = new Audio('data:audio/wav;base64,' + b64);
        currentAudio = a;
        a.onended = function () { if (currentAudio === a) currentAudio = null; };
        var p = a.play();
        if (p && p.then) p.then(resolve, reject); else resolve();
      } catch (e) { reject(e); }
    });
  }

  function doSendRequests(fc) {
    var summary = String((fc.args && fc.args.summary) || '').trim();
    var sys = addMsg('sys', '実行役のトラに送っています…', { persist: false });
    postToGas({ action: 'submit', text: transcriptText(), summary: summary }, false)
      .then(function (r) {
        live.sent = true;
        sys.remove();
        addMsg('me', summary, { who: '春木さん → 実行役のトラ', card: true });
        addMsg('sys', (r.unconfirmed ? '送りました（返事は未確認）' : '送りました ' + (r.at || '') + (r.file ? '（' + r.file + '）' : '')) + '。実行役のトラの返事はこの画面に届きます', { persist: true });
        toolResponse(fc, { ok: true, result: 'sent', file: r.file || '' });
      })
      .catch(function (e) {
        sys.setText('送れませんでした：' + (e && e.message ? e.message : e));
        toolResponse(fc, { ok: false, error: String(e && e.message ? e.message : e) });
      });
  }
  function endCall(note, byServer) {
    var wasOn = live.on;
    live.on = false;
    clearInterval(live.timer); live.timer = null;
    try { if (live.ws && live.ws.readyState <= 1) live.ws.close(1000); } catch (e) {}
    live.ws = null;
    stopAudio();
    try { if (live.node) live.node.disconnect(); if (live.src) live.src.disconnect(); } catch (e) {}
    live.node = null; live.src = null;
    if (live.stream) { live.stream.getTracks().forEach(function (t) { t.stop(); }); live.stream = null; }
    if (live.ctx) { try { live.ctx.close(); } catch (e) {} live.ctx = null; }
    closeTurnBubbles();
    $('btnCall').disabled = false; $('btnCall').className = ''; $('btnCall').textContent = '話す';
    setStatus('「話す」を押すとトラと通話になります');
    if (wasOn && live.started) {
      addMsg('sys', '通話を終えました ' + nowHM() + (note ? '。' + note : ''), { persist: true });
      var hasMe = live.transcript.some(function (t) { return t.side === 'me'; });
      if (!live.sent && hasMe) $('endPrompt').classList.remove('hidden');
    } else if (note) addMsg('sys', note, { persist: false });
    live.started = 0;
  }
  // 通話をまとめずに切ったとき：文字起こしをそのまま送る（まとめ無し＝v1 と同じ扱いで即答が付く）
  function sendTranscript() {
    var t = transcriptText();
    if (!t) { $('endPrompt').classList.add('hidden'); return; }
    $('btnSendTranscript').disabled = true;
    postToGas({ action: 'submit', text: '（通話の文字起こし。まとめ無し）\n' + t }, false)
      .then(function (r) {
        $('btnSendTranscript').disabled = false; $('endPrompt').classList.add('hidden');
        addMsg('sys', '文字起こしを送りました ' + (r.at || '') + (r.file ? '（' + r.file + '）' : ''), { persist: true });
        if (r.reply) { var b = addMsg('tora', r.reply, { who: 'トラ（即答）', audio: r.audio || '', tts: true }); if (AUTOPLAY && r.audio) b.play().catch(function () {}); }
        live.transcript = [];
      })
      .catch(function (e) { $('btnSendTranscript').disabled = false; addMsg('sys', '送れませんでした：' + (e && e.message ? e.message : e), { persist: false }); });
  }

  // ===== 文字で打つ（v1 の経路。音声認識はブラウザ任せ、送ると即答が付く）=====
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, committed = '', sessionFinal = '', interim = '', stopRequested = false, lastCommitted = '', baseText = '';
  function renderComposer() {
    var f = sessionFinal.trim(); if (f === lastCommitted) f = '';
    var t = (committed + (f ? (committed ? ' ' : '') + f : '') + (interim ? ' ' + interim : '')).trim();
    $('text').value = baseText ? (t ? baseText + '\n' + t : baseText) : t;
  }
  function startListening() {
    var me = new SR(); rec = me;
    me.lang = 'ja-JP'; me.continuous = false; me.interimResults = true; me.maxAlternatives = 1;
    me.onresult = function (e) {
      if (me !== rec) return;
      sessionFinal = ''; interim = ''; var prev = '';
      for (var i = 0; i < e.results.length; i++) {
        var t = (e.results[i][0].transcript || '').trim(); if (!t) continue;
        if (e.results[i].isFinal) { if (t !== prev) sessionFinal += t; prev = t; } else interim += t;
      }
      renderComposer();
    };
    me.onerror = function (e) {
      if (me !== rec) return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { $('composerHint').textContent = 'マイクの許可がありません。ブラウザの設定でこのサイトのマイクを許可してください'; stopRequested = true; }
      else if (e.error === 'no-speech' || e.error === 'aborted') { /* onend で再開 */ }
      else { $('composerHint').textContent = '音声認識でエラー（' + e.error + '）。キーボードで打てます'; stopRequested = true; }
    };
    me.onend = function () {
      if (me !== rec) return;
      var f = sessionFinal.trim();
      if (f && f !== lastCommitted) { committed += (committed ? ' ' : '') + f; lastCommitted = f; }
      sessionFinal = ''; interim = ''; renderComposer();
      if (listening && !stopRequested) { try { me.start(); return; } catch (err) {} }
      stopListening(true);
    };
    try {
      baseText = $('text').value.trim(); committed = ''; sessionFinal = ''; interim = ''; lastCommitted = '';
      me.start(); listening = true; stopRequested = false;
      $('btnMic').classList.add('rec'); $('btnMic').textContent = '止める';
    } catch (err) { $('composerHint').textContent = '音声認識を始められませんでした。キーボードで打てます'; }
  }
  function stopListening(ended) {
    var me = rec; stopRequested = true; listening = false;
    $('btnMic').classList.remove('rec'); $('btnMic').textContent = 'マイクで入れる';
    if (!ended) { try { me.stop(); } catch (e) {} setTimeout(function () { if (me === rec) { try { me.abort(); } catch (e) {} } }, 700); }
    renderComposer(); baseText = $('text').value.trim(); committed = ''; sessionFinal = ''; interim = '';
  }
  function sendText() {
    var t = $('text').value.trim();
    if (!t) { showErr('err', '本文が空です'); return; }
    if (t.length > 20000) { showErr('err', '長すぎます（20,000 文字まで）'); return; }
    if (listening) stopListening(false);
    $('btnSend').disabled = true; $('btnSend').textContent = '送っています…（10 秒ほど）';
    $('err').classList.add('hidden');
    postToGas({ action: 'submit', text: t }, false)
      .then(function (r) {
        $('btnSend').disabled = false; $('btnSend').textContent = 'トラに送る';
        $('text').value = ''; baseText = '';
        addMsg('me', t, {});
        addMsg('sys', (r.unconfirmed ? '届けました（返事は未確認。心配なら Drive の work-inbox を見る）' : '届けました ' + (r.at || '') + (r.file ? '（' + r.file + '）' : '')) + '。30 分以内に実行役のトラが動きます', { persist: true });
        if (r.reply) { var b = addMsg('tora', r.reply, { who: 'トラ（即答）', audio: r.audio || '', tts: true }); if (AUTOPLAY && r.audio) b.play().catch(function () {}); }
        else if (!r.unconfirmed) addMsg('sys', 'トラの即答はありませんでした' + (r.replyError ? '（' + r.replyError + '）' : ''), { persist: false });
        $('composer').classList.add('hidden');
      })
      .catch(function (e) {
        $('btnSend').disabled = false; $('btnSend').textContent = 'トラに送る';
        showErr('err', '送れませんでした：' + (e && e.message ? e.message : e) + '。電波を確認してもう一度');
      });
  }

  // ===== ボタン =====
  $('btnCall').addEventListener('click', function () {
    if (!live.on) { try { $('briefAudio').pause(); } catch (e) {} }   // 通話を始めるときは朝ブリーフを止める（マイクが拾うため）
    if (live.on) endCall('', false); else startCall();
  });
  $('btnType').addEventListener('click', function () {
    var c = $('composer'); c.classList.toggle('hidden');
    if (!c.classList.contains('hidden')) { $('endPrompt').classList.add('hidden'); $('text').focus(); scrollChat(); }
  });
  $('btnCloseComposer').addEventListener('click', function () { if (listening) stopListening(false); $('composer').classList.add('hidden'); });
  $('btnMic').addEventListener('click', function () { if (!SR) return; listening ? stopListening(false) : startListening(); });
  $('btnSend').addEventListener('click', sendText);
  $('btnClear').addEventListener('click', function () { $('text').value = ''; baseText = ''; committed = ''; sessionFinal = ''; interim = ''; $('err').classList.add('hidden'); $('text').focus(); });
  $('btnSendTranscript').addEventListener('click', sendTranscript);
  $('btnDiscard').addEventListener('click', function () { $('endPrompt').classList.add('hidden'); live.transcript = []; });
  $('btnSettings').addEventListener('click', function () { if (live.on) endCall('', false); $('inGas').value = GAS; $('inKey').value = KEY; $('inAutoplay').checked = AUTOPLAY; $('inLiveVoice').checked = LIVE_VOICE; show('secSettings'); });
  $('btnSaveSettings').addEventListener('click', function () {
    var g = normalizeGas($('inGas').value), k = $('inKey').value.trim();
    if (!validGas(g)) { showErr('errSettings', 'URL は https://script.google.com/macros/s/…/exec の形です'); return; }
    if (!k) { showErr('errSettings', '鍵が空です'); return; }
    GAS = g; KEY = k;
    AUTOPLAY = !!$('inAutoplay').checked; LIVE_VOICE = !!$('inLiveVoice').checked;
    try { localStorage.setItem(LS_GAS, g); localStorage.setItem(LS_KEY, k); localStorage.setItem(LS_AUTOPLAY, AUTOPLAY ? '1' : '0'); localStorage.setItem(LS_LIVE_VOICE, LIVE_VOICE ? '1' : '0'); } catch (e) {}
    putSettingsInUrl(g, k);
    $('errSettings').classList.add('hidden');
    show('secChat'); scrollChat();
    startPolling();
    loadBrief('', false);
  });
  $('btnClearChat').addEventListener('click', function () { chatLog = []; saveHistory(); renderHistory(); });

  // ===== 起動 =====
  renderHistory();
  if (!LIVE_OK) {
    $('btnCall').disabled = true; $('btnCall').textContent = 'この端末は通話に非対応';
    $('composer').classList.remove('hidden');
    addMsg('sys', 'このブラウザでは通話モードが使えません（WebSocket かマイクが無い）。「文字で打つ」で送れます', { persist: false });
  }
  if (!SR) { $('btnMic').disabled = true; $('btnMic').textContent = 'キーボードのマイクで'; }
  if (!validGas(GAS) || !KEY) {
    $('inGas').value = GAS || urlGas; $('inKey').value = KEY || urlKey;
    if (urlGas && !validGas(urlGas)) showErr('errSettings', 'GAS から渡された URL が …/exec の形ではありません（' + urlGas + '）。GAS のスクリプトプロパティ WEBAPP_URL に /exec の URL を入れると直ります。ここで手で直してもよいです');
    $('inAutoplay').checked = AUTOPLAY; $('inLiveVoice').checked = LIVE_VOICE;
    show('secSettings');
  } else { show('secChat'); scrollChat(); startPolling(); loadBrief('', false); }
</script>
</body>
</html>
